[package]
name = "ecash-elements-exchange"
version = "0.1.0"
edition = "2024"

[dependencies]
smplx-std = "0.0.9"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
